name: Run Generator and Save Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Save Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
          -H 'Content-Type: application/json' \
          -X POST \
          -d '{
            "contents": [{
              "parts":[{"text": "Write a 9-minute YouTube script for the channel Daily Dark Facts about an ultimate Space Mystery. Include a powerful hook, detailed body, three distinct calls to subscribe, and two 30-second Short scripts at the end."}]
            }]
          }')

          echo "$RESPONSE" | grep -o '"text":[^}]*' > script_output.txt

      - name: Commit and Push Script
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add script_output.txt
          git commit -m "Auto-generated YouTube script by system" || echo "No changes to commit"
          git push
