name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install google-generativeai

    - name: Run Python Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3 -c "
        import google.generativeai as genai
        import os
        
        genai.configure(api_key=os.environ['GEMINI_API_KEY'])
        
        try:
            model = genai.GenerativeModel('gemini-1.5-flash')
            response = model.generate_content('Write a short engaging YouTube script about deep sea mysteries.')
            print('=== START OF GENERATED SCRIPT ===')
            print(response.text)
            print('=== END OF GENERATED SCRIPT ===')
        except Exception as e:
            print('Error occurred:', e)
        "

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
          echo "Gradle files are in subfolder, skipping root build for now."
        else
          echo "No gradlew found, skipping build."
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
