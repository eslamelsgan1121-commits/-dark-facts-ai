name: Run Generator
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl "" \
          -H 'Content-Type: application/json' \
          -X POST \
          -d '{
            "contents": [{
              "parts":[{"text": "Write a 9-minute YouTube script for Daily Dark Facts about Space Mystery. Include a hook, body, 3 calls to subscribe, and 2 Short scripts."}]
            }]
          }'
