name: Automated System Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build with Gradle
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          find . -name "gradlew" -execdir ./gradlew assembleDebug \;
