name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Make script directory
      run: mkdir -p build_output

    - name: Create output file
      run: echo "Build Successful" > build_output/app.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: App-Artifact
        path: build_output/
